<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito | Urban Void</title>
    <link rel="stylesheet" href="../Estilos/estilos.css">
    <style>
        /* Puedes mover esto a estilos.css */
        .cart-page { max-width: 900px; margin: 40px auto; padding: 0 20px; color: #fff; }
        .cart-page h2 { margin-bottom: 24px; }
        #cart-items { list-style: none; padding: 0; margin: 0; }
        .cart-row {
            display: grid;
            grid-template-columns: 80px 1fr auto 90px auto;
            gap: 16px;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid #2a2a2a;
        }
        .cart-row img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; }
        .cart-info { display: flex; flex-direction: column; gap: 4px; }
        .cart-info span { color: #aaa; font-size: 14px; }
        .cart-qty { display: flex; align-items: center; gap: 10px; }
        .cart-qty button {
            width: 30px; height: 30px; background: #222; color: #fff;
            border: 1px solid #444; border-radius: 4px; cursor: pointer;
        }
        .cart-qty button:hover { border-color: #8a2be2; }
        .cart-sub { text-align: right; font-weight: 700; }
        .cart-remove { background: none; border: none; color: #aaa; cursor: pointer; text-decoration: underline; }
        .cart-remove:hover { color: #fff; }
        #cart-summary { margin-top: 24px; display: flex; flex-direction: column; align-items: flex-end; gap: 16px; }
        .cart-total-line { font-size: 22px; font-weight: 700; }
        .cart-buttons { display: flex; gap: 12px; }
        .cart-buttons button, .cart-buttons a {
            padding: 12px 24px; border-radius: 4px; font-weight: 700;
            cursor: pointer; text-decoration: none; border: 1px solid #444;
            background: #222; color: #fff; font-size: 14px;
        }
        .cart-buttons .primary { background: #fff; color: #000; border-color: #fff; }
        #cart-empty { color: #aaa; }
        #cart-empty a { color: #fff; }
        @media (max-width: 640px) {
            .cart-row { grid-template-columns: 70px 1fr; }
            .cart-qty, .cart-sub, .cart-remove { grid-column: 2; justify-self: start; }
        }
    </style>
</head>
<body>
    <header>
        <nav>
                      <div class="nav-links">
                <a href="../index.html">Inicio</a>
                <a href="Camisas.html">Apparel</a>
                <a href="Pantalones.html">Bottoms</a>
                <a href="Zapatos.html">Sneakers</a>
            </div>


            <div class="header-cart">
                <a class="btn-cart-header" href="carrito.html">
                    Carrito (<span id="cart-count">0</span>)
                </a>
            </div>
        </nav>
    </header>

    <main class="cart-page">
        <h2>Tu carrito</h2>

        <p id="cart-empty" hidden>
            Tu carrito está vacío. <a href="Index.html">Ver la ropa</a>
        </p>

        <ul id="cart-items"></ul>

        <div id="cart-summary" hidden>
            <div class="cart-total-line">Total: <span id="cart-total">$0.00</span></div>
            <div class="cart-buttons">
                <button onclick="clearCart()">Vaciar carrito</button>
               <button class="primary" onclick="openCheckout()">Finalizar compra</button>
            </div>
        </div>
    </main>

    <script src="carrito.js"></script>
</body>
</html>
